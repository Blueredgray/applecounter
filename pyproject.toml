[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "applecounter"
version = "0.1.0"
description = "Подсчёт яблок на видео пролёта: детекция, трекинг без повторов, разбивка по деревьям, прогноз урожая"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Apple Counter Team" }]
dependencies = [
    "numpy>=1.23",
    "opencv-python>=4.7",
    "scipy>=1.9",
    "pandas>=1.5",
    "PyYAML>=6.0",
    "matplotlib>=3.6",
]

[project.optional-dependencies]
yolo = ["ultralytics>=8.0", "torch>=2.0"]
dev = ["pytest>=7.0"]

[project.scripts]
applecounter = "applecounter.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
